<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Tech</title>
    <link rel="stylesheet" href="custom.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header id="inicio" class="header">
    <div class="overlay">
        <h1>⚡ Tienda Tech</h1>
        <p>Lo mejor en tecnología al mejor precio</p>
    </div>
</header>

<nav>
    <a href="#inicio">Inicio</a>
    <a href="#productos">Productos</a>
    <a href="#formulario">Formulario</a>
</nav>

<section id="productos" class="productos">
    <h2>Productos Destacados</h2>

    <div class="contenedor-productos">

        <article class="card">
            <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8" alt="Laptop">
            <h3>Laptop Gamer</h3>
            <p>Alto rendimiento</p>
        </article>

        <article class="card">
            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" alt="Celular">
            <h3>Smartphone</h3>
            <p>Última generación</p>
        </article>

        <article class="card">
            <img src="https://images.unsplash.com/photo-1580894908361-967195033215" alt="Audifonos">
            <h3>Audífonos</h3>
            <p>Sonido premium</p>
        </article>

        <article class="card">
            <img src="https://images.unsplash.com/photo-1587825140708-dfaf72ae4b04" alt="Tablet">
            <h3>Tablet</h3>
            <p>Ideal para estudio</p>
        </article>

    </div>
</section>

<section id="formulario">
    <h2>Formulario de Compra</h2>

    <form id="formulario" action="#" method="POST">

        <input type="text" id="nombre" placeholder="Nombre" required>
        <input type="email" id="email" placeholder="Correo" required>
        <input type="password" id="password" placeholder="Contraseña" required>

        <label>Selecciona un producto:</label>
        <select id="producto" required>
            <option value="">-- Seleccionar --</option>
            <option value="Laptop Gamer">Laptop Gamer</option>
            <option value="Smartphone">Smartphone</option>
            <option value="Audífonos">Audífonos</option>
            <option value="Tablet">Tablet</option>
        </select>

        <label>Cantidad:</label>
        <input type="number" id="cantidad" min="1" value="1" required>

        <p>Tipo de pago:</p>
        <label><input type="radio" name="envio" value="Efectivo"> Efectivo</label>
        <label><input type="radio" name="envio" value="Tarjeta"> Tarjeta</label>

        <label>Fecha y hora de compra:</label>
        <input type="datetime-local" id="fecha" readonly>

        <label>
            <input type="checkbox" id="terminos"> Aceptar términos y condiciones
        </label>

        <button type="submit">Comprar</button>
    </form>

    <p id="mensaje"></p>
</section>

<footer>
    <p>© 2026 Tienda Tech</p>
</footer>

<script src="script.js"></script>
</body>
</html>
